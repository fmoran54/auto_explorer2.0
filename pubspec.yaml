name: auto_explorer
description: "Aplicación Flutter para explorar vehículos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_auto_explorer.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_auto_explorer.png"
  remove_alpha_ios: true